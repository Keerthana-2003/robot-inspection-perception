name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Tests
        run: pytest -q -rs

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test C++ kernels
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j
          ctest --test-dir cpp/build --output-on-failure

  ros2:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-numpy python3-scipy python3-opencv python3-yaml python3-pytest
          pip3 install --break-system-packages --no-deps .
      - name: colcon build
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p /ws/src && cp -r ros2/inspection_perception_ros /ws/src/
          cd /ws && colcon build --packages-select inspection_perception_ros
      - name: Node imports against real rclpy and message types
        run: |
          source /opt/ros/jazzy/setup.bash && source /ws/install/setup.bash
          python3 -c "import rclpy; from inspection_perception_ros.node import InspectionNode, image_to_numpy; print('ok')"
          python3 -m pytest -q tests/test_ros_conversions.py

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v5
      - name: Build deployment image
        run: docker build -f docker/Dockerfile -t inspection-perception .
      - name: Smoke test
        run: docker run --rm --entrypoint python inspection-perception -c "import perception.pipeline, onnxruntime; print('ok')"
